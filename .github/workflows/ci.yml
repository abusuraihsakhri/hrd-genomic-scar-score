name: Test and security checks
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install build
      - name: Python compile and test
        run: |
          python -m compileall -q agents hrd_scar.py cli.py enrichment.py simulator.py
          python -m pytest -q
      - name: Validate installed CLI and distribution
        run: |
          hrd-scar single --loh 10 --tai 4 --lst 9
          python -m build --no-isolation
      - name: Browser JavaScript tests
        run: |
          node --check web/app.mjs
          node --check web/scoring.mjs
          node --test tests/web.test.mjs
