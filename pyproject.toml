[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hrd-genomic-scar-score"
version = "3.0.1"
description = "Research-only sum of precomputed LOH, TAI and LST genomic scar event counts"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Dr. Abu Suraih Sakhri"}]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.0"]
test = ["pytest>=7.0", "pydantic>=2.0"]
all = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pytest>=7.0", "pydantic>=2.0"]

[project.scripts]
hrd-scar = "hrd_scar:main"

[tool.setuptools]
packages = ["agents"]
py-modules = ["hrd_scar", "cli", "enrichment", "simulator"]

[tool.pytest.ini_options]
testpaths = [".", "tests"]
python_files = ["test_*.py"]
