[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hrd-genomic-scar-score"
version = "3.0.0"
description = "Homologous Recombination Deficiency (HRD) Scar Score - Zero-dependency Python implementation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Dr. Abu Suraih Sakhri"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
test = ["pytest>=7.0"]
all = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pytest>=7.0", "pydantic>=2.0"]

[project.scripts]
hrd-scar = "hrd_scar:main"

[tool.setuptools]
packages = ["agents"]

[tool.pytest.ini_options]
testpaths = [".", "tests"]
python_files = ["test_*.py"]
